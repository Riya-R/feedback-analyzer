<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Feedback Sentiment Analyzer</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
      padding: 50px;
    }
    textarea {
      width: 80%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #4CAF50;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Employee Feedback Sentiment Analyzer</h1>
  <p>Type feedback below to analyze its sentiment:</p>
  
  <textarea id="feedback" placeholder="Enter employee feedback here..."></textarea>
  <br>
  <button onclick="analyzeSentiment()">Analyze</button>
  
  <div class="result" id="result"></div>

<script>
  function analyzeSentiment() {
    const feedback = document.getElementById("feedback").value.toLowerCase();
    const resultDiv = document.getElementById("result");

    // Expanded keyword lists
    const positiveWords = [
      "love", "great", "good", "amazing", "awesome", "excellent", "supportive",
      "helpful", "appreciate", "fantastic", "wonderful", "happy", "satisfied",
      "improve", "motivated", "best", "positive"
    ];

    const negativeWords = [
      "bad", "poor", "terrible", "awful", "hate", "worse", "worst", "dissatisfied",
      "unhappy", "slow", "angry", "problem", "issue", "stress", "pressure", "boring"
    ];

    let sentiment = "neutral";
    let color = "gray";
    let emoji = "😐";

    // Simple rule-based detection
    for (let word of positiveWords) {
      if (feedback.includes(word)) {
        sentiment = "positive";
        color = "green";
        emoji = "😊";
        break;
      }
    }

    for (let word of negativeWords) {
      if (feedback.includes(word)) {
        sentiment = "negative";
        color = "red";
        emoji = "😞";
        break;
      }
    }

    resultDiv.innerHTML = `${emoji} ${sentiment.charAt(0).toUpperCase() + sentiment.slice(1)} Feedback!`;
    resultDiv.style.color = color;
  }
</script>

</body>
</html>
